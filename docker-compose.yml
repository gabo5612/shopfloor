services:
  db:
    image: pgvector/pgvector:pg18
    container_name: shopfloor-db
    environment:
      POSTGRES_USER: shopfloor
      POSTGRES_PASSWORD: shopfloor
      POSTGRES_DB: shopfloor
    ports: ["5433:5432"]
    volumes:
      - shopfloor-pgdata:/var/lib/postgresql
      - ./src/shopfloor/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopfloor -d shopfloor"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  shopfloor-pgdata:
