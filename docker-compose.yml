services:
  db:
    image: pgvector/pgvector:pg18
    container_name: anvil-db
    environment:
      POSTGRES_USER: anvil
      POSTGRES_PASSWORD: anvil
      POSTGRES_DB: anvil
    ports: ["5433:5432"]
    volumes:
      - anvil-pgdata:/var/lib/postgresql
      - ./src/anvil/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anvil -d anvil"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  anvil-pgdata:
