[project]
name = "anvil"
version = "0.1.0"
description = "Asistente on-prem de documentacion tecnica"
requires-python = ">=3.12"
dependencies = [
  "docling",
  "psycopg[binary]",
  "fastapi",
  "uvicorn[standard]",
  "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "reportlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anvil"]
